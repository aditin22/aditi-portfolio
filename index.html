<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aditi Navhal — Software Engineer · .NET &amp; React</title>
    <meta
      name="description"
      content="Aditi Navhal — Software Engineer with 3 years building and modernizing enterprise applications with C#, .NET Core, React, TypeScript and SQL."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <!-- Pre-paint theme: dark is the default, only an explicit stored 'light' opts out.
         Mirrors useTheme.init() in src/store/theme.ts - the two MUST agree or the page
         paints one theme and then flips. -->
    <script>
      document.documentElement.classList.add('dark');
      try {
        if (localStorage.getItem('an-theme') === 'light')
          document.documentElement.classList.remove('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
